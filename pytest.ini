[pytest]
# 仅在仓库根 tests/ 下发现用例；插件实现目录不再承载测试
testpaths = tests
python_files = test_*.py
python_classes = *Test Test*
python_functions = test_*
addopts = --import-mode=importlib
# 按插件代际分会话运行（同名插件包冲突）；marker 供后续筛选扩展
markers =
    v1: v1 插件（plugins/）单测，需与 v2 分独立会话运行
    v2: v2 插件（plugins/）单测，需与 v1 分独立会话运行
    v3: v3 插件（plugins.v3/）单测，需与其他代分独立会话运行
